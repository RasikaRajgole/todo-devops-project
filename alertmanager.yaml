global:
  slack_api_url: 'https://hooks.slack.com/services/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'
receivers:
- name: "null"
- name: slack-notifications
  slack_configs:
  - channel: '#alerts'
    send_resolved: true
    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
    text: "{{ range .Alerts }}*Alert:* {{ .Annotations.summary }}\n*Severity:* {{ .Labels.severity }}\n{{ end }}"
- name: slack-critical
  slack_configs:
  - channel: '#alerts'
    send_resolved: true
    title: ':fire: CRITICAL: {{ .CommonLabels.alertname }}'
    text: "{{ range .Alerts }}*Alert:* {{ .Annotations.summary }}\n*Description:* {{ .Annotations.description }}\n{{ end }}"
route:
  group_by: ['alertname', 'namespace']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: slack-notifications
  routes:
  - matchers:
    - alertname = "Watchdog"
    receiver: "null"
  - matchers:
    - severity = "critical"
    receiver: slack-critical
    repeat_interval: 1h
  - matchers:
    - severity = "warning"
    receiver: slack-notifications
templates:
- /etc/alertmanager/config/*.tmpl
