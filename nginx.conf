server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /todos {
        proxy_pass http://todo-backend-service.default.svc.cluster.local/todos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://todo-backend-service.default.svc.cluster.local/health;
    }
}
