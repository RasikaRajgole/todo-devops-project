apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todo-app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: todo-app-alerts
      rules:

        - alert: PodDown
          expr: kube_pod_status_phase{namespace="default", phase="Failed"} > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is down"
            description: "Pod {{ $labels.pod }} in namespace default has been down for more than 2 minutes."

        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="default", container="todo-app"}[2m]))
            / sum(kube_pod_container_resource_limits{namespace="default", container="todo-app", resource="cpu"}) * 100 > 80
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on todo-app"
            description: "todo-app CPU usage is above 80% for 2 minutes. Current: {{ $value | printf \"%.1f\" }}%"

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_usage_bytes{namespace="default", container="todo-app"})
            / sum(kube_pod_container_resource_limits{namespace="default", container="todo-app", resource="memory"}) * 100 > 80
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on todo-app"
            description: "todo-app memory usage is above 80% for 2 minutes. Current: {{ $value | printf \"%.1f\" }}%"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="default"}[2m]) * 60 > 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} is restarting more than once per minute."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="default", deployment="todo-app"}
            != kube_deployment_status_available_replicas{namespace="default", deployment="todo-app"}
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Deployment replicas mismatch"
            description: "todo-app desired replicas != available replicas for 2 minutes."

        - alert: HPAMaxReplicasReached
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="default"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="default"}
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "HPA at maximum replicas"
            description: "todo-app HPA has reached max replicas ({{ $value }}). Consider increasing limits."
